[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "soc-connector-framework"
version = "0.1.0"
description = "Extensible Python framework that fetches security events from cloud and network sources, normalizes them to ECS, and forwards them to SOC destinations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "soc-connector-framework contributors" }]
keywords = [
  "soc",
  "siem",
  "ecs",
  "cloudtrail",
  "entra-id",
  "syslog",
  "wazuh",
  "elasticsearch",
  "threat-detection",
  "log-normalization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "tenacity>=8.2,<10",
  "httpx>=0.27,<1",
  "boto3>=1.34",
  "azure-identity>=1.16",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-python-dateutil",
  "types-boto3",
  "moto>=5.0",
]

[project.scripts]
soc-connectors = "soc_connectors.cli:main"

[project.urls]
Homepage = "https://github.com/laffet-takwa/soc-connector-framework"
Issues = "https://github.com/laffet-takwa/soc-connector-framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_connectors"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "config", "docs", "docker", "scripts", "README.md", "LICENSE"]

[tool.uv]
# mypy's Windows wheel is a mypyc-compiled build whose DLL is refused by Windows
# app-control on the development machine; building from source keeps `python -m mypy`
# runnable on every platform the same way.
no-binary-package = ["mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "TRY", "PTH", "PL", "RUF"]
ignore = [
  "PLR0913", # connector constructors legitimately take config + clock + client
  "TRY003",  # keep raised messages informative; validation happens at system boundaries
  "RUF012",  # mutable class defaults are validated by pydantic, not mutated
]

[tool.ruff.lint.per-file-ignores]
# tests/**: assertions compare against literal fixtures, and a pytest fixture receives its
# dependencies as positional parameters by design.
"tests/**" = ["ARG", "PTH", "TRY", "S", "PLR2004", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["soc_connectors"]

[tool.ruff.format]
# ruff format is the formatter (Black-compatible style). Black itself is not used:
# its Windows wheel ships an unsigned mypyc DLL that app-control blocks on this
# developer machine, so a formatter that cannot be run locally cannot be a gate.
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "moto.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "unit: fast tests with no external processes",
  "integration: tests that need Docker services (docker/docker-compose.yml)",
  "slow: tests deliberately kept out of the default CI path",
]
filterwarnings = ["error", "ignore::DeprecationWarning:moto.*"]

[tool.coverage.run]
branch = true
source = ["src/soc_connectors"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
