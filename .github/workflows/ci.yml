name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: lint + type + test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # uv is installed with pip instead of a third-party action so the CI job uses the
      # same pinned-by-project tooling as a developer machine.
      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install the project and dev tools
        run: uv sync --extra dev

      - name: Ruff
        run: uv run --extra dev ruff check src tests scripts

      - name: Ruff format check
        run: uv run --extra dev ruff format --check src tests scripts

      - name: mypy
        run: uv run --extra dev python -m mypy

      - name: Unit tests
        run: uv run --extra dev python -m pytest -m unit --junitxml=pytest-${{ matrix.python-version }}.xml

      - name: No hardcoded secrets
        run: uv run python scripts/check_no_secrets.py

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-*.xml

  # Coverage gate (--cov-fail-under=80) and the Docker build/integration job are enabled
  # once the code they measure exists: coverage in M5-M7, docker build in M6.
