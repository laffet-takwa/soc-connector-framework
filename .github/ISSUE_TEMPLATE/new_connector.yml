---
name: New data source or destination
description: Propose a connector (source) or forwarder (destination)
labels: [connector]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [Connector (source), Forwarder (destination)]
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Which product and API/format
      description: >
        Link the official documentation for the log format or REST endpoint. Include the
        version you are targeting. Do not propose a field mapping without a doc link.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample record
      description: >
        Paste one record with everything synthetic or anonymized: fake account and tenant
        ids, RFC 5737 documentation IPs (203.0.113.0/24), example.com domains.
      render: json
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: Proposed ECS mapping
      description: Table of source field -> ECS field, plus event.category/type/outcome choices.
    validations:
      required: true
  - type: textarea
    id: auth
    attributes:
      label: Authentication and least privilege
      description: >
        Exactly which permission/scope/IAM action is needed, so docs/security.md can state
        the minimum.
    validations:
      required: true
